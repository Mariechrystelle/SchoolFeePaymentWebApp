{% extends 'base.html' %}
{% block body_class %}login-page{% endblock %}
{% block content %}
<section class="auth-shell">
  <div class="auth-card">
    <h2>{{ t('welcome_back') }}</h2>
    <p class="auth-subtitle">{{ t('login_in_subtitle') }}</p>
    <form class="form auth-form" method="post" autocomplete="off">
      <label>{{ t('email') }}
        <div class="field-with-icon">
          <span class="field-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 6h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2zm0 2v.2L12 13l8-4.8V8H4z"/></svg>
          </span>
          <input type="email" name="email" placeholder="Enter email" required autocomplete="off" autocapitalize="none" spellcheck="false" />
        </div>
      </label>

      <label>{{ t('password') }}
        <div class="field-with-icon password-field">
          <span class="field-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M17 9h-1V7a4 4 0 1 0-8 0v2H7a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2zm-7-2a2 2 0 1 1 4 0v2h-4V7z"/></svg>
          </span>
          <input id="login-password" type="password" name="password" required autocomplete="new-password" />
          <button class="password-toggle" type="button" data-toggle-password="login-password" aria-label="Show password">
            <svg viewBox="0 0 24 24"><path d="M12 5c5.5 0 9.6 4.5 10.8 6-1.2 1.5-5.3 6-10.8 6S2.4 12.5 1.2 11C2.4 9.5 6.5 5 12 5zm0 2c-3.8 0-6.9 2.8-8.6 4 1.7 1.2 4.8 4 8.6 4s6.9-2.8 8.6-4c-1.7-1.2-4.8-4-8.6-4zm0 2.2a1.8 1.8 0 1 1 0 3.6 1.8 1.8 0 0 1 0-3.6z"/></svg>
          </button>
        </div>
      </label>

      <button class="btn" type="submit">{{ t('login_in') }}</button>
      <p class="auth-links">
        <a href="{{ url_for('forgot_password') }}">Forgot Password?</a>
      </p>
    </form>
  </div>
</section>
{% endblock %}
