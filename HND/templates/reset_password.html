{% extends 'base.html' %}
{% block body_class %}login-page{% endblock %}
{% block content %}
<section class="auth-shell">
  <div class="auth-card">
    <h2>Reset Password</h2>
    <p class="auth-subtitle">Enter your reset token and choose a new password.</p>
    <form class="form auth-form" method="post" autocomplete="off">
      <label>Reset Token
        <input type="text" name="token" required autocomplete="off" />
      </label>

      <label>{{ t('password') }}
        <div class="field-with-icon password-field">
          <span class="field-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M17 9h-1V7a4 4 0 1 0-8 0v2H7a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2zm-7-2a2 2 0 1 1 4 0v2h-4V7z"/></svg>
          </span>
          <input id="reset-password" type="password" name="new_password" minlength="9" required autocomplete="new-password" />
          <button class="password-toggle" type="button" data-toggle-password="reset-password" aria-label="Show password">
            <svg viewBox="0 0 24 24"><path d="M12 5c5.5 0 9.6 4.5 10.8 6-1.2 1.5-5.3 6-10.8 6S2.4 12.5 1.2 11C2.4 9.5 6.5 5 12 5zm0 2c-3.8 0-6.9 2.8-8.6 4 1.7 1.2 4.8 4 8.6 4s6.9-2.8 8.6-4c-1.7-1.2-4.8-4-8.6-4zm0 2.2a1.8 1.8 0 1 1 0 3.6 1.8 1.8 0 0 1 0-3.6z"/></svg>
          </button>
        </div>
        <small class="password-policy">Use at least 9 characters with 1 uppercase, 1 number, and 1 special character.</small>
      </label>

      <button class="btn" type="submit">Reset Password</button>
    </form>
  </div>
</section>
{% endblock %}
